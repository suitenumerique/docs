name: Docker Hub Workflow
run-name: Docker Hub Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    # `labeled` starts the trivy scan as soon as the `trivy` label is added;
    # the other labels skip every job (see the `if` of the build jobs).
    types: [opened, synchronize, reopened, labeled]
    branches:
      - "main"

env:
  DOCKER_USER: 1001:127
  SHOULD_PUSH: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'preview') }}

permissions:
  contents: read

# One run per pull request: a new push cancels the run of the previous one.
# Branches and tags get a group of their own, queued instead of cancelled (only
# the latest pending run is kept): an image push or the Argo CD notification is
# never stopped halfway, and two runs never race to push the same tag.
# Adding a label other than `trivy` gets a group of its own: its run does
# nothing and must not cancel the build of the pull request.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{
    github.event.action == 'labeled' && github.event.label.name != 'trivy'
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push-backend:
    if: github.event.action != 'labeled' || github.event.label.name == 'trivy'
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      image_name: lasuite/impress-backend
      context: .
      file: Dockerfile
      target: backend-production
      should_push: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'preview') }}
      trivy_scan: ${{ startsWith(github.head_ref || github.ref_name, 'release/') || contains(github.event.pull_request.labels.*.name, 'trivy') }}
      docker_user: 1001:127

  build-and-push-frontend:
    if: github.event.action != 'labeled' || github.event.label.name == 'trivy'
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      image_name: lasuite/impress-frontend
      context: .
      file: src/frontend/Dockerfile
      target: frontend-production
      arm64_reuse_amd64_build_arg: "FRONTEND_IMAGE"
      should_push: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'preview') }}
      trivy_scan: ${{ startsWith(github.head_ref || github.ref_name, 'release/') || contains(github.event.pull_request.labels.*.name, 'trivy') }}
      docker_user: 1001:127

  build-and-push-y-provider:
    if: github.event.action != 'labeled' || github.event.label.name == 'trivy'
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      image_name: lasuite/impress-y-provider
      context: .
      file: src/frontend/servers/y-provider/Dockerfile
      target: y-provider
      should_push: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'preview') }}
      trivy_scan: ${{ startsWith(github.head_ref || github.ref_name, 'release/') || contains(github.event.pull_request.labels.*.name, 'trivy') }}
      docker_user: 1001:127

  build-and-push-yhub:
    if: github.event.action != 'labeled' || github.event.label.name == 'trivy'
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      image_name: lasuite/impress-yhub
      context: .
      file: src/yhub-server/Dockerfile
      target: yhub
      should_push: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'preview') }}
      trivy_scan: ${{ startsWith(github.head_ref || github.ref_name, 'release/') || contains(github.event.pull_request.labels.*.name, 'trivy') }}
      docker_user: 1000:1000

  notify-argocd:
    needs:
      - build-and-push-backend
      - build-and-push-frontend
      - build-and-push-y-provider
      - build-and-push-yhub
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'preview')
    steps:
      - uses: numerique-gouv/action-argocd-webhook-notification@cac2ee67896eb13e84e804f60c4271370424eaa8 # main
        id: notify
        with:
          deployment_repo_path: "${{ secrets.DEPLOYMENT_REPO_URL }}"
          argocd_webhook_secret: "${{ secrets.ARGOCD_PREPROD_WEBHOOK_SECRET }}"
          argocd_url: "${{ vars.ARGOCD_PREPROD_WEBHOOK_URL }}"
